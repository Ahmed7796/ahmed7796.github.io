# Pages CMS configuration — https://pagescms.org/docs
# Edits made in the CMS are committed to main, which triggers the
# GitHub Pages deploy workflow (.github/workflows/deploy.yml).

media:
  - name: images
    label: Images
    input: public/images
    output: /images
    categories: [image]

content:
  - name: site
    label: Portfolio
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: headline
        label: Headline
        type: string
      - name: bio
        label: Bio
        type: text
      - name: avatar
        label: Photo
        type: image
        options:
          media: images
      - name: email
        label: Contact email
        type: string
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
          - name: image
            label: Screenshot
            type: image
            options:
              media: images
          - name: url
            label: Live URL
            type: string
          - name: repo
            label: Source code URL
            type: string
          - name: tags
            label: Tags
            type: string
            list: true
